# Tide bundle patch — 安装后 DSH 会把它合成到当前 profile。
# 行 id 与包名必须对应：<包名>#<行 id> 就是插件配置页的键。
- insert:
    - id: tide
      name: 'dsh-chat-tide'
      config:
        enabled: true
        scope:
          # off | all | qq | follow | workspace | preset | sessions
          # follow = 跟着 QQBot：QQ 会话 + 同一工作区的本地会话。
          # 只用本地聊天时改成 workspace（填 cwd）或 sessions（填会话 id）。
          mode: 'follow'
        embedding:
          enabled: true
          model: 'Xenova/bge-small-zh-v1.5'
          dtype: 'q8'
          cacheDir: ''
          remoteHost: 'https://hf-mirror.com'
        features:
          ingest: true
          writePipeline: true
          egressGate: false
          contextInject: true
          routing: true
          tools: true
          writeTools: false
        extract:
          # 抽取用哪个模型不在这里配：跟随当前会话正在用的模型
          minChars: 6
        context:
          enabled: true
          maxChars: 1200
          eventLimit: 5
