name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 探针只用 sqlite-vec 与 transformers 的纯 JS 部分；原生 postinstall
      # （onnxruntime / sharp）在 CI 里既不需要，又最容易因为下载失败把整步拖垮。
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # 需要真实向量模型的探针会下载约 30MB 权重，CI 里跳过；
      # 其余探针自带临时数据库，不读写用户数据。
      - name: Probes and consistency checks
        run: node scripts/run-checks.mjs --skip-model

      - name: Package contents
        run: |
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.txt"
          if grep -E 'presets/private\.json|[^/]\.db$' "$RUNNER_TEMP/pack.txt"; then
            echo "包内容里出现了私人文件或数据库"
            exit 1
          fi
          if ! grep -q 'lib/index.js' "$RUNNER_TEMP/pack.txt"; then
            echo "包内容缺少入口文件"
            exit 1
          fi
